<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AllySim</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="game-container">
    <h1>The Journey of a Refugee</h1>
    <div id="scenario-container">
        <div id="scenario"></div>
    </div>
    
    <div id="btn-container" class="btn-container"></div>

    <div id="resources" class="fade-in">
        <h3>Make a <b>REAL</b> difference :</h3>
        <p>Social injustice is not a game. Here are some organisations who make a real difference in Canada :</p>
        <ul>
            <li style="margin-bottom: 10px;"><a href="https://ccrweb.ca/fr" target="_blank">Canadian Council for Refugees (CCR)</a></li>
            <li style="margin-bottom: 10px;"><a href="https://www.unicef.ca/fr" target="_blank">UNICEF Canada</a></li>
        </ul>
        <button onclick="location.reload()" style="margin-top:10px;">Recommencer la simulation</button>
    </div>
</div>

<footer class="lang-footer">
    <a href="/AllySim/en" class="lang-link">English</a>
    <a href="/AllySim/fr" class="lang-link">Français</a>
</footer>

<script>
    const scenarioElement = document.getElementById('scenario');
    const btnContainer = document.getElementById('btn-container');
    const resourceDiv = document.getElementById('resources');

    const storyNodes = {
        1: {
            text: "You arrive in Canada after fleeing a conflict. You only have $200 and untranslated documents",
            options: [
                { text: "Go to a refugee shelter", nextNode: 2 },
                { text: "Spend $50 on a taxi to a distant relitives address", nextNode: 3 }
            ]
        },
        2: {
            text: "You arrive at a local shelter. Looking around, you see other refugees from all over the place.",
            options: [
                { text: "Wait 10 days for a free, official translator", nextNode: 7 },
                { text: "Accept under-the-table cash work immediately to pay for private translation", nextNode: 5 },
                { text: "Look at the job board for open, availiable jobs", nextNode: 6 }
            ]
        },
        3: {
            text: "You spend $50 and get a taxi to your distants relitives house, the one who moved to Canada years ago. You walk up to their door, they anwser",
            options: [
                { text: "Ask to say", nextNode: 4 }
            ]
        },
        4: {
            text: "Your relitive lets you stay on their couch as long as you pay rent. You pay",
            options: [
                { text: "Pool resources, relative helps translate docs unofficially", nextNode: 10 },
                { text: "Swallow pride, seek shelter help before 30 days", nextNode: 2 },
                { text: "Beg to stay missed deadline", nextNode: 11 },
            ]
        },


        5: {
            text: "On the board you find one job listing. There are is a listing for...",
            options: [
                { text: "Entry level groacery store worker", nextNode: 16 },
                { text: "Change your mind, pay a Private Translator", nextNode: 18 }
            ]
        },
        6: {
            text: "Independent Legal Search",
            options: [
                { text: "Desperation sets in, need cash for good lawyer", nextNode: 5 },
                { text: "Choose random lawyer", nextNode: 19 },
                { text: "Use cash to buy equipment", nextNode: 20 },
            ]
        },
        7: {
            text: "After 10 days the translator arrives. She translates your documents, opening doors to employment",
            options: [
                { text: "Apply for community college upskilling", nextNode: 8 },
                { text: "Find a government-placed entry-level job", nextNode: 9 },
            ]
        },
        8: {
            text: "Education Track",
            options: [
                { text: "Graduation and Career (REPLACE OPTION TITLE)", nextNode: 12 },
                { text: "Heavy Student Debt (REPLACE OPTION TITLE)", nextNode: 13 },
            ]
        },
        9: {
            text: "After a few weeks you are able to find a government-placed entry-level job, passing the interview",
            options: [
                { text: "Bare Minimum", nextNode: 14 },
                { text: "Extra Effort", nextNode: 15 },
            ]
        },


        10: {
            text: "Good Ending: Strong Community Roots",
            options: [
                { text: "End simulation.", nextNode: 'end' }
            ]
        },
        11: {
            text: "Bad Ending: Kicked out mid-winter & Deported. Over time your relationship sours over money. Eventually your relitive kicks you out, mid winter. With the shelters full, you turn to the only way you can survive, stealing. You eventually get caught, and having missed the document deadline, get deported",
            options: [
                { text: "End simulation.", nextNode: 'end' }
            ]
        },
        12: {
            text: "Good Ending: Graduation & Career",
            options: [
                { text: "End simulation.", nextNode: 'end' }
            ]
        },
        13: {
            text: "Normal End: Heavy Student Debt",
            options: [
                { text: "End simulation.", nextNode: 'end' }
            ]
        },
        14: {
            text: "Good Ending: Promoted to Manager",
            options: [
                { text: "End simulation.", nextNode: 'end' }
            ]
        },
        15: {
            text: "Normal Ending: Stagnant Minimum Wage",
            options: [
                { text: "End simulation.", nextNode: 'end' }
            ]
        },
        16: {
            text: "Bad Ending: You get the job at the store and start earning, but over time your employer starts exploiting you, witholding checks and gaslighting you. You miss your document deadline, you get Deported",
            options: [
                { text: "End simulation.", nextNode: 'end' }
            ]
        },
        17: {
            text: "Bad Ending: Arrested in Workplace Raid, Deported",
            options: [
                { text: "End simulation.", nextNode: 'end' }
            ]
        },
        18: {
            text: "Normal Ending: Paid Private Translator just in time, but broke",
            options: [
                { text: "End simulation.", nextNode: 'end' }
            ]
        },
        19: {
            text: "Bad Ending: Scammed by fake lawyer, Deported",
            options: [
                { text: "End simulation.", nextNode: 'end' }
            ]
        },
        20: {
            text: "Good Ending: Found excellent lawyer, expedited PR, start business",
            options: [
                { text: "End simulation.", nextNode: 'end' }
            ]
        }
    };

    function startNode(nodeIndex) {
        btnContainer.innerHTML = '';
        scenarioElement.innerHTML = '';
        
        if (nodeIndex === 'end') {
            scenarioElement.innerHTML = "<div class='fade-in'>La simulation est terminée. Dans la vraie vie, les choix sont souvent impossibles à faire seul sans accès aux ressources de base.</div>";
            resourceDiv.style.display = 'block';
            return;
        }

        const node = storyNodes[nodeIndex];

        const textDiv = document.createElement('div');
        textDiv.className = 'fade-in';
        textDiv.innerText = node.text;
        scenarioElement.appendChild(textDiv);

        node.options.forEach((option, index) => {
            setTimeout(() => {
                const btn = document.createElement('button');
                btn.className = 'fade-in';
                btn.innerText = option.text;
                btn.onclick = () => startNode(option.nextNode);
                btnContainer.appendChild(btn);
            }, (index + 1) * 600); 
        });
    }

    startNode(1);
</script>

</body>
</html>
