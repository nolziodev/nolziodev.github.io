<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AllySim</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: #121212; 
            color: #e0e0e0; 
            display: flex; 
            flex-direction: column; /* Allows content to stack vertically */
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
            min-height: 90vh; 
        }
        #game-container { 
            width: 100%;
            max-width: 600px; 
            background: #1e1e1e; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            min-height: 300px; 
            box-sizing: border-box;
        }
        h1 { color: #4caf50; font-size: 1.5rem; margin-top: 0; }
        
        /* Animation: Fade in and move up */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            opacity: 0; /* Starts hidden */
            animation: fadeInUp 1s ease forwards;
        }

        #scenario { margin-bottom: 25px; line-height: 1.6; font-size: 1.1rem; }
        .btn-container { display: grid; gap: 10px; }
        
        button { 
            background: #333; color: white; border: 1px solid #444; 
            padding: 12px; border-radius: 4px; cursor: pointer; 
            transition: 0.2s; text-align: left; font-size: 1rem;
        }
        button:hover { background: #4caf50; color: white; border-color: #4caf50; }
        
        #resources { margin-top: 30px; padding-top: 20px; border-top: 1px solid #444; display: none; }
        a { color: #81c784; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }

        /* Language Link Footer Styling */
        .lang-footer {
            margin-top: 40px;
            display: flex;
            gap: 24px; /* Adds space horizontally between links */
            justify-content: center;
        }
        .lang-link {
            color: #888;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }
        .lang-link:hover {
            color: #4caf50;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <h1>Simulation: Le Parcours d'un Réfugié</h1>
    <div id="scenario-container">
        <div id="scenario"></div>
    </div>
    
    <div id="btn-container" class="btn-container"></div>

    <div id="resources" class="fade-in">
        <h3>Faire une différence réelle :</h3>
        <p>L'injustice sociale n'est pas un jeu. Voici des organisations qui aident réellement au Canada :</p>
        <ul>
            <li style="margin-bottom: 10px;"><a href="https://ccrweb.ca/fr" target="_blank">Conseil canadien pour les réfugiés (CCR)</a></li>
            <li style="margin-bottom: 10px;"><a href="https://www.unicef.ca/fr" target="_blank">UNICEF Canada - Droits des enfants</a></li>
        </ul>
        <button onclick="location.reload()" style="margin-top:10px;">Recommencer la simulation</button>
    </div>
</div>

<footer class="lang-footer">
    <a href="/AllySim/en" class="lang-link">English</a>
    <a href="/AllySim/fr" class="lang-link">Français</a>
</footer>

            ]
        }
    };

    function startNode(nodeIndex) {
        btnContainer.innerHTML = '';
        scenarioElement.innerHTML = '';
        
        if (nodeIndex === 'end') {
            scenarioElement.innerHTML = "<div class='fade-in'>La simulation est terminée. Dans la vraie vie, les choix sont souvent impossibles à faire seul sans accès aux ressources de base.</div>";
            resourceDiv.style.display = 'block';
            return;
        }

        const node = storyNodes[nodeIndex];

        const textDiv = document.createElement('div');
        textDiv.className = 'fade-in';
        textDiv.innerText = node.text;
        scenarioElement.appendChild(textDiv);

        node.options.forEach((option, index) => {
            setTimeout(() => {
                const btn = document.createElement('button');
                btn.className = 'fade-in';
                btn.innerText = option.text;
                btn.onclick = () => startNode(option.nextNode);
                btnContainer.appendChild(btn);
            }, (index + 1) * 600); 
        });
    }

    startNode(1);
</script>

</body>
</html>
